title = "vocabs-platform secret scanning"

[extend]
useDefault = true

# Gitleaks >= 8.21: inherit the rule and all its default detection settings.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Allow only the known Anubis signing-key field name in exact configuration and test files where it is intentionally referenced"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''^chart/vocabs/values\.yaml$''',
  '''^environments/example\.yaml$''',
  '''^environments/vocabs-platform-dev\.yaml$''',
  '''^docs/rancher\.md$''',
  '''^tests/gateway/test_gateway\.py$''',
  '''^tests/helm/test_render\.py$'''
]
regexes = ['''^ed25519-private-key-hex$''']
