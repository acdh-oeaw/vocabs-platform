stack:
  version: "2026.09.0-dev"
global:
  publicUrl: "https://vocabs-platform-dev.acdh-dev.oeaw.ac.at/"
  # The pilot uses the cluster's cert-manager ClusterIssuer and managed TLS secret.
networkPolicy:
  enabled: false
gateway:
  enabled: true
  replicas: 1
  anubis:
    signingKey:
      secret:
        create: true
        name: vocabs-platform-anubis-signing
        existingSecret: ""
        key: ed25519-private-key-hex
skosmos:
  replicas: 1
  config:
    existingConfigMap: vocabs-platform-dev-vocabs-skosmos-config-r005a
    revision: r005a
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
fuseki:
  replicas: 1
  persistence:
    mountPath: /fuseki/databases
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 3Gi}
  auth:
    enabled: true
    secret:
      create: true
      existingSecret: ""
      name: vocabs-fuseki-shiro
      key: shiro.ini
    initialUsername: admin
    revision: ""
  ingress:
    enabled: true
    host: jena-vp-dev.acdh-cluster-2.arz.oeaw.ac.at
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: acdh-prod
    redmineId: "12346"
    tls:
      enabled: true
      secretName: jena-vp-dev-tls
data:
  activeClaim: vocabs-data-r005
  revision: r005
  managedClaims:
    - name: vocabs-data-r006
      size: 40Gi
      accessModes: [ReadWriteMany]
      retain: true
ingress:
  enabled: true
  className: nginx
  redmineId: "12347"
  annotations:
    cert-manager.io/cluster-issuer: acdh-prod
  tls:
    enabled: true
    secretName: vocabs-platform-dev-tls
swagger:
  enabled: true
  specUrl: "/swagger.json"
  ingress:
    enabled: true
    allowAnubisBypass: true
    host: vocabsapi-vp-dev.acdh-dev.oeaw.ac.at
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: acdh-prod
    redmineId: "12349"
    tls:
      enabled: true
      secretName: vocabsapi-vp-dev-tls
vinyl:
  podAnnotations:
    vocabs.acdh.oeaw.ac.at/data-revision: vocabs-data-r005/r005
  service:
    type: ClusterIP
    port: 80
    targetPort: 6081
    internalTrafficPolicy: Cluster
