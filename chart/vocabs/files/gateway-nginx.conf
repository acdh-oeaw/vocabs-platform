{{- $public := include "vocabs.public" . | fromYaml -}}
# Full upstream alpine image provides this module. Native rewrite cannot URL-escape a variable.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    js_import redirects from /etc/vocabs/redirects.js;

    # TLS terminates at Ingress, not here. Trust only validated single-token schemes;
    # fallback to the canonical URL, never the internal HTTP $scheme.
    map $http_x_forwarded_proto $public_scheme {
        default {{ $public.scheme }};
        http http;
        https https;
    }
    map $http_x_forwarded_for $client_chain {
        default $http_x_forwarded_for;
        "" $http_x_real_ip;
    }
    # Host/X-Forwarded-Host are canonical rather than client-controlled.
    upstream skosmos {
        server {{ include "vocabs.fullname" . }}-skosmos:{{ .Values.skosmos.service.port }};
    }
    server {
        listen 127.0.0.1:8081;
        server_name {{ $public.host }};
        set $vocabs_public_url {{ $public.url | quote }};
        set $vocabs_concept_status {{ .Values.gateway.conceptResolver.redirectStatus }};
        set $vocabs_external_prefix "";
        set $vocabs_external_target "";
        set $vocabs_external_status 301;
        {{- if .Values.gateway.cors.enabled }}
        add_header Access-Control-Allow-Methods {{ join ", " .Values.gateway.cors.allowMethods | quote }} always;
        add_header Access-Control-Max-Age {{ .Values.gateway.cors.maxAge | quote }} always;
        add_header Access-Control-Allow-Headers {{ join ", " .Values.gateway.cors.allowHeaders | quote }} always;
        {{- with .Values.gateway.cors.allowOrigin }}
        add_header Access-Control-Allow-Origin {{ . | quote }} always;
        {{- end }}
        if ($request_method = OPTIONS) { return 204; }
        {{- end }}
        location = /healthz { access_log off; return 200 "ok\n"; }
        {{- if and .Values.gateway.conceptResolver.enabled .Values.gateway.conceptResolver.namespaces }}
        # Namespace list is declarative; schema restricts entries to literal path segments.
        location ~ ^/({{ join "|" .Values.gateway.conceptResolver.namespaces }})/.+ {
            js_content redirects.concept;
        }
        {{- end }}
        {{- range .Values.gateway.externalRedirects }}
        location ~ ^/{{ .prefix }}(/|$) {
            set $vocabs_external_prefix {{ .prefix | quote }};
            set $vocabs_external_target {{ .targetBaseUrl | quote }};
            set $vocabs_external_status {{ .status }};
            js_content redirects.external;
        }
        {{- end }}
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host {{ $public.authority | quote }};
            proxy_set_header X-Forwarded-Host {{ $public.authority | quote }};
            proxy_set_header X-Forwarded-Proto $public_scheme;
            # Anubis normalizes the ingress client chain; do not append loopback here.
            proxy_set_header X-Forwarded-For $client_chain;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_pass http://skosmos;
        }
    }
}
