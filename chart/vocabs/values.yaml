# Select one reviewed combination. The initial profile is NOT production certified.
stack:
  version: "2026.09.0-dev"
compatibility:
  allowUnsupported: false # Testing only; never bypasses single-writer/import safety.
  overrides:
    skosmosVersion: ""
    jenaVersion: "" # One override for BOTH runtime and tools.
    storageEngine: "" # TDB1 or TDB2; never converts existing data.
    imageRevision: ""
nameOverride: ""
fullnameOverride: ""
commonLabels: {}
commonAnnotations: {}
imagePullSecrets: []
# Varnish upstream consumes global settings. Do not set reserved selector labels.
global:
  publicUrl: "" # Absolute http(s) root URL with trailing slash; required for the gateway.
  imagePullSecrets: []
  labels: {}
  annotations: {}
  # Explicit bridge for the dependency's tpl context. Must match parent values; checked at render time.
  vocabsFusekiHost: "" # Empty resolves <release>-vocabs-fuseki; set if overriding parent name.
  vocabsFusekiPort: "3030"
serviceAccount:
  create: true
  name: ""
  annotations: {}

skosmos:
  enabled: true
  replicas: 1 # Use 2+ after checking statelessness of migrated plugins.
  image:
    repository: ghcr.io/acdh-oeaw/vocabs-skosmos
    tag: "" # Resolved from profile; manual tags require allowUnsupported.
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  config:
    existingConfigMap: "" # Recommended: ConfigMap with config.ttl key.
    revision: "" # Change when an externally managed ConfigMap changes.
    inline: "" # Optional complete development TTL, evaluated as a Helm template.
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  podAnnotations: {}
  podSecurityContext:
    seccompProfile: {type: RuntimeDefault}
  # Upstream Apache starts as root, binds port 80 and drops to www-data.
  # Arbitrary UID/drop ALL is incompatible without adapting the image.
  securityContext:
    allowPrivilegeEscalation: false
  readinessProbe: {path: /en/, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
  livenessProbe: {path: /en/, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6}

# Passed to official varnish-cache 0.1.3; inspect its values before adding options.
varnish:
  nameOverride: varnish
  serviceAccount:
    create: true
  server:
    kind: Deployment
    replicas: 1
    image: {repository: docker.io/varnish, tag: "9.0.0", pullPolicy: IfNotPresent}
    service:
      type: ClusterIP
      externalTrafficPolicy: ""
      internalTrafficPolicy: Cluster
      http: {enabled: true, port: 80}
    ingress: {enabled: false}
    hostNetwork: false
    varnishncsa: {enabled: false}
    networkPolicy: {enabled: false} # Parent chart owns the restrictive policy.
    affinity: "" # Allow a single-node development cluster.
    strategy: {type: Recreate} # Avoid retaining the previous process cache during activation.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
    # Keep this annotation equal to <data.activeClaim>/<data.revision>; enforced by Helm.
    podAnnotations:
      vocabs.acdh.oeaw.ac.at/data-revision: "vocabs-data-r001/r001"
    vclConfig: '{{ include "vocabs.vcl" . }}' # Override with a complete custom VCL.

fuseki:
  replicas: 1 # Any other value is rejected, even in unsupported mode.
  image:
    repository: ghcr.io/acdh-oeaw/vocabs-fuseki
    tag: ""
    pullPolicy: IfNotPresent
  service: {type: ClusterIP, port: 3030}
  terminationGracePeriodSeconds: 120
  java: {xms: 512m, xmx: 2g}
  persistence:
    mountPath: /fuseki/databases # Same path in runtime AND importer assembler.
  config:
    existingConfigMap: "" # assembler.ttl key; same assembler mounts in importer.
    revision: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 3Gi}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  startupProbe: {path: /$/ping, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 60}
  readinessProbe: {path: /$/ping, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
  livenessProbe: {path: /$/ping, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6}

data:
  activeClaim: vocabs-data-r001 # Explicit existing or managed claim in this namespace.
  revision: r001 # Change with activeClaim; claim itself also participates in cache checksum.
  managedClaims:
    - name: vocabs-data-r001
      size: 10Gi
      storageClassName: "" # Omit storageClassName to use cluster default; '-' disables dynamic provisioning.
      accessModes: [ReadWriteOnce]
      retain: true # Mandatory for database claims; delete explicitly after retention.

imports:
  job:
    enabled: false # Ordinary resource, NEVER a Helm hook.
    name: candidate-r002 # Unique per attempt; Jobs have immutable specs.
    backoffLimit: 0 # Partially populated destinations deliberately cannot be retried.
    ttlSecondsAfterFinished: 86400
  image:
    repository: ghcr.io/acdh-oeaw/vocabs-jena-tools
    tag: ""
    pullPolicy: IfNotPresent
  targetClaim: ""
  source:
    type: pvc
    pvc:
      existingClaim: ""
      file: /data/example.rdf
  validateRdf: true
  buildTextIndex: true
  java: {xms: 1g, xmx: 4g}
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 6Gi}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}

swagger:
  enabled: false
  image: {repository: docker.io/swaggerapi/swagger-ui, tag: "v5.17.14", pullPolicy: IfNotPresent}
  specUrl: "" # Public URL of Skosmos swagger.json; required when enabled.
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
  podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
  securityContext: {allowPrivilegeEscalation: false}
  ingress:
    enabled: false
    allowAnubisBypass: false # Must explicitly acknowledge a separate unprotected Swagger ingress.
    host: "" # Dedicated host; '/' needs no rewrite rules.
    className: ""
    annotations: {}
    tls: {enabled: false, secretName: ""}

ingress:
  enabled: false
  className: "" # Host is derived from global.publicUrl.
  annotations: {}
  tls: {enabled: false, secretName: ""}

networkPolicy:
  enabled: true # Requires a CNI which enforces NetworkPolicy.
  fusekiAdditionalPeers: [] # Kubernetes NetworkPolicyPeer objects; namespace selector optional.
  varnishAdditionalPeers: []
  # Explicit NetworkPolicyPeer objects for your ingress controller. Empty denies ingress.
  # Example selectors live in docs/gateway.md; no cluster labels are assumed.
  gatewayIngressPeers: []
  skosmosAdditionalPeers: []

# Public HTTP gateway: enable explicitly with global.publicUrl set in environment values.
gateway:
  enabled: false
  replicas: 1 # Local Anubis memory/bbolt state is single-instance; >1 always rejected here.
  service: {type: ClusterIP, port: 80}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000 # Grants the verified Anubis UID write access to its state volume.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  anubis:
    enabled: true # Cannot be disabled while gateway is enabled.
    image: {repository: ghcr.io/techarohq/anubis, tag: "v1.27.0", pullPolicy: IfNotPresent}
    listenPort: 8080
    target: {url: "http://127.0.0.1:8081"} # Fixed same-pod backend; checked at render time.
    policy:
      existingConfigMap: "" # Full policy.yaml; must preserve the selected store configuration.
      revision: "" # Bump to roll out external policy changes.
    signingKey:
      existingSecret: "" # Required when ingress.enabled=true; backend-only development may omit it.
      key: ed25519-private-key-hex # Upstream expects a hex-encoded 32-byte Ed25519 seed.
    store: {backend: bbolt} # Only bbolt or memory; no Redis/Valkey or operator.
    persistence:
      enabled: true # bbolt on PVC; false uses emptyDir and loses state on pod replacement.
      existingClaim: ""
      size: 1Gi
      storageClassName: "" # Empty uses cluster default, '-' selects static provisioning.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000 # Verified ghcr.io/techarohq/anubis:v1.27.0 image USER.
      runAsGroup: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  nginx:
    image: {repository: docker.io/nginxinc/nginx-unprivileged, tag: "1.30.5-alpine", pullPolicy: IfNotPresent}
    listenPort: 8081 # Bound ONLY to 127.0.0.1, never exposed by a Service.
    securityContext:
      runAsNonRoot: true
      runAsUser: 101 # Verified upstream image UID/GID defaults.
      runAsGroup: 101
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
    resources:
      requests: {cpu: 50m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
  conceptResolver:
    enabled: true
    redirectStatus: 302
    namespaces:
      - dhataxonomy
      - traveldigital
      - hsinstruments
      - archeaccessrestrictions
      - archecategory
      - archelifecyclestatus
      - defcthesaurus
      - iadthesaurus
      - iso6391
      - oefosdisciplines
      - iso6393
      - vicavdialects
      - archeoaisets
      - archelicenses
      - date
      - unit_of_time
      - oeai-cultural-periods
      - legalkraus
      - indigo
      - graphis-imgreg
      - oeai-materials
  externalRedirects:
    - {prefix: tadirah, targetBaseUrl: "https://vocabs.dariah.eu/tadirah", status: 301}
    - {prefix: invocation-type, targetBaseUrl: "https://vocabs.dariah.eu/invocation-type", status: 301}
    - {prefix: bbt, targetBaseUrl: "https://vocabs.dariah.eu/bbt", status: 301}
  cors:
    enabled: true
    allowOrigin: "" # No new origin policy by default; set '*' or an explicit origin after review.
    allowMethods: [POST, GET, OPTIONS, DELETE, PUT]
    maxAge: 1000
    allowHeaders: [x-requested-with, Content-Type, origin, accept]
