{{- if and .Values.gateway.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vocabs.fullname" . }}-skosmos
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vocabs.selector" . | nindent 6 }}
      app.kubernetes.io/component: skosmos
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vocabs.selector" . | nindent 14 }}
              app.kubernetes.io/component: gateway
        {{- with .Values.networkPolicy.skosmosAdditionalPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports: [{protocol: TCP, port: 80}]
{{- end }}
