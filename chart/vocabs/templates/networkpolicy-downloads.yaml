{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vocabs.fullname" . }}-downloads
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vocabs.selector" . | nindent 6 }}
      app.kubernetes.io/component: downloads
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.gatewayIngressPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.gatewayIngressPeers | nindent 8 }}
      ports: [{protocol: TCP, port: 80}]
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
