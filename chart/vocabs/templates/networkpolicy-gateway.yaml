{{- if and .Values.gateway.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vocabs.fullname" . }}-gateway
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vocabs.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  {{- if .Values.networkPolicy.gatewayIngressPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.gatewayIngressPeers | nindent 8 }}
      ports: [{protocol: TCP, port: 8080}]
  {{- else }}
  ingress: [] # Supply the cluster's ingress-controller selectors to admit traffic.
  {{- end }}
{{- end }}
