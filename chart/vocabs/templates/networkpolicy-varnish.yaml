{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vocabs.fullname" . }}-varnish
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "varnish-cache.selectorLabels" .Subcharts.varnish | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vocabs.selector" . | nindent 14 }}
              app.kubernetes.io/component: skosmos
        {{- with .Values.networkPolicy.varnishAdditionalPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.varnish.server.http.port }}}
{{- end }}
