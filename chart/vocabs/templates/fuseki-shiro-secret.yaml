{{- if and .Values.fuseki.auth.enabled .Values.fuseki.auth.secret.create }}
{{- $name := include "vocabs.fusekiAuthSecretName" . -}}
{{- $key := .Values.fuseki.auth.secret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{ if $existing }}
{{- $data := default (dict) (get $existing "data") }}
{{- if not (hasKey $data $key) }}{{ fail (printf "Managed Fuseki authentication Secret %q exists but is missing key %q" $name $key) }}{{ end }}
data:
  {{ $key | quote }}: {{ get $data $key | quote }}
{{- else }}
{{- $password := randAlphaNum 48 -}}
{{- $context := dict "Values" .Values "authInitialPassword" $password -}}
stringData:
  {{ $key | quote }}: |
{{ tpl (.Files.Get "files/shiro.ini.tpl") $context | nindent 4 }}
{{- end }}
{{- end }}
