{{- $i := .Values.swagger.ingress -}}
{{- if $i.enabled }}
{{- if not .Values.swagger.enabled }}{{ fail "swagger must be enabled for its Ingress" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vocabs.fullname" . }}-vocabsapi
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
    ID: {{ required "Redmine ID is required when Swagger Ingress is enabled" $i.redmineId | quote }}
  annotations:
    {{- toYaml $i.annotations | nindent 4 }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $i.tls.enabled }}
  tls:
    - hosts: [{{ required "Ingress host is required" $i.host | quote }}]
      secretName: {{ required "TLS secretName is required when TLS is enabled" $i.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "Ingress host is required" $i.host | quote }}
      http:
        paths:
          - path: /swagger.json
            pathType: Exact
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-skosmos
                port:
                  number: {{ .Values.skosmos.service.port }}
          - path: /rest/v1
            pathType: Exact
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          - path: /rest/v1/
            pathType: Exact
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          - path: /rest/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-skosmos
                port:
                  number: {{ .Values.skosmos.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-swagger
                port:
                  number: 8080
{{- end }}
