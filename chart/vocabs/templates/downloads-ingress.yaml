{{- $i := .Values.downloads.ingress -}}
{{- if $i.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vocabs.fullname" . }}-downloads
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
    ID: {{ required "Redmine ID is required for Downloads Ingress" $i.redmineId | quote }}
  annotations:
    {{- toYaml $i.annotations | nindent 4 }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $i.tls.enabled }}
  tls:
    - hosts: [{{ required "Downloads Ingress host is required" $i.host | quote }}]
      secretName: {{ required "Downloads TLS secretName is required" $i.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "Downloads Ingress host is required" $i.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vocabs.fullname" . }}-downloads
                port:
                  number: {{ .Values.downloads.service.port }}
{{- end }}
