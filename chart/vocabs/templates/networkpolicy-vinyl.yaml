{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vocabs.fullname" . }}-vinyl
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vocabs.selector" . | nindent 6 }}
      app.kubernetes.io/component: vinyl
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vocabs.selector" . | nindent 14 }}
              app.kubernetes.io/component: skosmos
        {{- with .Values.networkPolicy.vinylAdditionalPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.vinyl.service.targetPort }}
{{- end }}
