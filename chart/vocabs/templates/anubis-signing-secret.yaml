{{- if and .Values.gateway.enabled .Values.gateway.anubis.enabled .Values.gateway.anubis.signingKey.secret.create }}
{{- $name := include "vocabs.anubisSigningSecretName" . -}}
{{- $key := .Values.gateway.anubis.signingKey.secret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "vocabs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{ if $existing }}
{{- $data := default (dict) (get $existing "data") }}
{{- if not (hasKey $data $key) }}{{ fail (printf "Managed Anubis signing Secret %q exists but is missing key %q" $name $key) }}{{ end }}
data:
  {{ $key | quote }}: {{ get $data $key | quote }}
{{- else }}
stringData:
  {{ $key | quote }}: {{ sha256sum (randBytes 32) | quote }}
{{- end }}
{{- end }}
