name: Publish Helm chart
on:
  push:
    branches: [main]
    paths:
      - "chart/vocabs/**"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: helm-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/helm-ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch and verify publishing branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git branch -r
          git rev-parse --verify origin/gh-pages
      - name: Install pinned tools
        run: bash scripts/install-ci-tools.sh
      - name: Lint chart
        run: helm lint ./chart/vocabs
      - name: Guard immutable chart version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(${PWD}/.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("chart/vocabs/Chart.yaml"))["version"])')"
          release="vocabs-${version}"
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $release already exists; chart versions are immutable" >&2
            exit 1
          fi
          .venv/bin/python - "$version" <<'PY'
          import subprocess
          import sys
          import yaml

          version = sys.argv[1]
          index = yaml.safe_load(subprocess.check_output([
              "git", "show", "origin/gh-pages:index.yaml"
          ], text=True))
          entries = index.get("entries", {}).get("vocabs", [])
          versions = [entry.get("version") for entry in entries]
          if version in versions:
              raise SystemExit(
                  f"Chart version {version} already exists in the published Helm index; "
                  "chart versions are immutable"
              )
          duplicates = sorted({item for item in versions if versions.count(item) > 1})
          if duplicates:
              raise SystemExit(
                  "Published Helm index contains duplicate chart versions: "
                  + ", ".join(duplicates)
              )
          PY
      - name: Configure publishing identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Verify publishing state
        shell: bash
        run: |
          set -euo pipefail
          git remote -v
          git branch -a
          git rev-parse --verify origin/gh-pages
      - name: Publish chart release and HTTP repository index
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.7.0
          charts_dir: chart
          pages_branch: gh-pages
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Sync Helm repository landing page
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git rev-parse --verify origin/gh-pages

          worktree="$(mktemp -d "$RUNNER_TEMP/gh-pages.XXXXXX")"
          cleanup() {
            git worktree remove --force "$worktree"
          }
          trap cleanup EXIT

          git worktree add "$worktree" origin/gh-pages
          cp index.html "$worktree/index.html"
          touch "$worktree/.nojekyll"

          git -C "$worktree" add index.html .nojekyll
          if git -C "$worktree" diff --cached --quiet; then
            echo "Landing page unchanged"
          else
            git -C "$worktree" commit -m "docs: update Helm repository landing page"
            git -C "$worktree" push origin HEAD:gh-pages
          fi
