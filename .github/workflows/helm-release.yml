name: Publish Helm chart
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: helm-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/helm-ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify publishing branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git branch -r
          git rev-parse --verify origin/gh-pages
      - name: Install pinned tools
        run: bash scripts/install-ci-tools.sh
      - name: Build chart dependencies
        run: helm dependency build ./chart/vocabs
      - name: Lint chart
        run: helm lint ./chart/vocabs
      - name: Configure publishing identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Verify publishing state
        shell: bash
        run: |
          set -euo pipefail
          git remote -v
          git branch -a
          git rev-parse --verify origin/gh-pages
      - name: Publish chart release and HTTP repository index
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.7.0
          charts_dir: chart
          pages_branch: gh-pages
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Sync Helm repository landing page
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git rev-parse --verify origin/gh-pages

          worktree="$(mktemp -d "$RUNNER_TEMP/gh-pages.XXXXXX")"
          cleanup() {
            git worktree remove --force "$worktree"
          }
          trap cleanup EXIT

          git worktree add "$worktree" origin/gh-pages
          cp index.html "$worktree/index.html"
          touch "$worktree/.nojekyll"

          git -C "$worktree" add index.html .nojekyll
          if git -C "$worktree" diff --cached --quiet; then
            echo "Landing page unchanged"
          else
            git -C "$worktree" commit -m "docs: update Helm repository landing page"
            git -C "$worktree" push origin HEAD:gh-pages
          fi
