name: Publish ACDH container images
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'branding/**'
      - 'scripts/build-images.py'
      - 'chart/vocabs/compatibility.yaml'
      - '.github/workflows/container-release.yml'
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve compatibility profile and build matrix
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import yaml

          profile = yaml.safe_load(Path('chart/vocabs/compatibility.yaml').read_text())['profiles']['2026.09.0-dev']
          if profile['jena']['version'] != profile['importer']['jenaVersion']:
              raise SystemExit('Profile invariant violated: runtime Jena version must equal importer Jena version')
          java_base = 'docker.io/library/eclipse-temurin:21-jdk-jammy@sha256:4cfc63a7118da9267c17e2c988e1599d83d5d64a3832a760f0e77c7e8f6b29f7'
          jena_version = profile['jena']['version']
          revision = profile['imageRevision']
          matrix = [
              {
                  'component': 'skosmos',
                  'file': 'images/skosmos/Dockerfile',
                  'tag': f"ghcr.io/acdh-oeaw/vocabs-skosmos:{profile['skosmos']['version']}-{revision}",
                  'build_args': f"SKOSMOS_UPSTREAM_TAG={profile['skosmos']['upstreamTag']}",
              },
              {
                  'component': 'fuseki',
                  'file': 'images/fuseki-runtime/Dockerfile',
                  'tag': f"ghcr.io/acdh-oeaw/vocabs-fuseki:{jena_version}-{revision}",
                  'build_args': '\n'.join([
                      f'JAVA_BASE_IMAGE={java_base}',
                      f'JENA_VERSION={jena_version}',
                      f"JENA_SHA512={profile['jena']['fusekiSha512']}",
                  ]),
              },
              {
                  'component': 'jena-tools',
                  'file': 'images/jena-tools/Dockerfile',
                  'tag': f"ghcr.io/acdh-oeaw/vocabs-jena-tools:{jena_version}-{revision}",
                  'build_args': '\n'.join([
                      f'JAVA_BASE_IMAGE={java_base}',
                      f'JENA_VERSION={jena_version}',
                      f"JENA_SHA512={profile['jena']['toolsSha512']}",
                      f"FUSEKI_SHA512={profile['jena']['fusekiSha512']}",
                  ]),
              },
          ]
          print(f"matrix={json.dumps({'include': matrix}, separators=(',', ':'))}")
          PY

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify published images are visible in GHCR
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ matrix.tag }}" >/dev/null
