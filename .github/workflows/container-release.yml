name: Publish ACDH container images
on:
  workflow_dispatch:
    inputs:
      component:
        description: Container component to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - skosmos
          - fuseki
          - jena-tools
          - vinyl
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Resolve compatibility profile and build matrix
        id: profile
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import yaml

          profile = yaml.safe_load(Path('chart/vocabs/compatibility.yaml').read_text())['profiles']['2026.09.0-dev']
          if profile['jena']['version'] != profile['importer']['jenaVersion']:
              raise SystemExit('Profile invariant violated: runtime Jena version must equal importer Jena version')
          java_base = 'docker.io/library/eclipse-temurin:21-jdk-jammy@sha256:4cfc63a7118da9267c17e2c988e1599d83d5d64a3832a760f0e77c7e8f6b29f7'
          jena_version = profile['jena']['version']
          revision = profile['imageRevision']
          skosmos_revision = profile['skosmos'].get('imageRevision', revision)
          importer_revision = profile['importer'].get('imageRevision', revision)
          matrix = [
              {
                  'component': 'skosmos',
                  'file': 'images/skosmos/Dockerfile',
                  'tag': f"ghcr.io/acdh-oeaw/vocabs-skosmos:{profile['skosmos']['version']}-{skosmos_revision}",
                  'build_args': f"SKOSMOS_UPSTREAM_TAG={profile['skosmos']['upstreamTag']}",
              },
              {
                'component': 'fuseki',
                'file': 'images/fuseki-runtime/Dockerfile',
                'tag': f"ghcr.io/acdh-oeaw/vocabs-fuseki:{jena_version}-{revision}",
                'build_args': '\n'.join([
                  f'JAVA_BASE_IMAGE={java_base}',
                  f'JENA_VERSION={jena_version}',
                  f"JENA_SHA512={profile['jena']['fusekiSha512']}",
                ]),
              },
              {
                'component': 'jena-tools',
                'file': 'images/jena-tools/Dockerfile',
                'tag': f"ghcr.io/acdh-oeaw/vocabs-jena-tools:{jena_version}-{importer_revision}",
                'build_args': '\n'.join([
                  f'JAVA_BASE_IMAGE={java_base}',
                  f'JENA_VERSION={jena_version}',
                  f"JENA_SHA512={profile['jena']['toolsSha512']}",
                  f"FUSEKI_SHA512={profile['jena']['fusekiSha512']}",
                ]),
              },
              {
                'component': 'vinyl',
                'file': 'images/vinyl/Dockerfile',
                'tag': f"ghcr.io/acdh-oeaw/vocabs-vinyl:{profile['vinyl']['version']}",
                'build_args': '\n'.join([
                  'DEBIAN_BASE_IMAGE=docker.io/library/debian:bookworm-slim@sha256:f3034a6ec3c1205360777c4aae76234998866ad18806ae62b63a3f84ccad782b',
                  f"VINYL_VERSION={profile['vinyl']['version']}",
                  f"VINYL_SHA256={profile['vinyl']['sha256']}",
                ]),
              },
          ]
          requested = os.environ['RELEASE_COMPONENT']
          if requested not in {'all', 'skosmos', 'fuseki', 'jena-tools', 'vinyl'}:
              raise SystemExit(f'Unsupported container component: {requested}')
          if requested != 'all':
              matrix = [item for item in matrix if item['component'] == requested]
          print(f"matrix={json.dumps({'include': matrix}, separators=(',', ':'))}")
          PY

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify published images are visible in GHCR
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ matrix.tag }}" >/dev/null
