name: Publish ACDH container images
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'branding/**'
      - 'scripts/build-images.py'
      - 'chart/vocabs/compatibility.yaml'
      - '.github/workflows/container-release.yml'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve compatibility profile and version invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import yaml
          from pathlib import Path
          profile = yaml.safe_load(Path('chart/vocabs/compatibility.yaml').read_text())['profiles']['2026.09.0-dev']
          if profile['jena']['version'] != profile['importer']['jenaVersion']:
              raise SystemExit('Profile invariant violated: runtime Jena version must equal importer Jena version')
          tags = {
              'SKOSMOS_TAG': f"ghcr.io/acdh-oeaw/vocabs-skosmos:{profile['skosmos']['version']}-{profile['imageRevision']}",
              'FUSEKI_TAG': f"ghcr.io/acdh-oeaw/vocabs-fuseki:{profile['jena']['version']}-{profile['imageRevision']}",
              'JENA_TOOLS_TAG': f"ghcr.io/acdh-oeaw/vocabs-jena-tools:{profile['jena']['version']}-{profile['imageRevision']}",
              'SKOSMOS_VERSION': profile['skosmos']['upstreamTag'],
              'JENA_VERSION': profile['jena']['version'],
              'TOOLS_SHA512': profile['jena']['toolsSha512'],
              'FUSEKI_SHA512': profile['jena']['fusekiSha512'],
              'JAVA_BASE_IMAGE': 'docker.io/library/eclipse-temurin:21-jdk-jammy@sha256:4cfc63a7118da9267c17e2c988e1599d83d5d64a3832a760f0e77c7e8f6b29f7',
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              for key, value in tags.items():
                  print(f'{key}={value}')
                  fh.write(f'{key}={value}\n')
          PY

      - name: Build and push the three explicit versioned images
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-images.py --java-base "$JAVA_BASE_IMAGE"
          docker push ghcr.io/acdh-oeaw/vocabs-skosmos:3.3-r1
          docker push ghcr.io/acdh-oeaw/vocabs-fuseki:5.4.0-r1
          docker push ghcr.io/acdh-oeaw/vocabs-jena-tools:5.4.0-r1

      - name: Verify published images are visible in GHCR
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            ghcr.io/acdh-oeaw/vocabs-skosmos:3.3-r1 \
            ghcr.io/acdh-oeaw/vocabs-fuseki:5.4.0-r1 \
            ghcr.io/acdh-oeaw/vocabs-jena-tools:5.4.0-r1
          do
            docker buildx imagetools inspect "$ref" >/dev/null
          done
