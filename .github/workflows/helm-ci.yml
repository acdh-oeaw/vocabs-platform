name: Helm validation
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned tools
        shell: bash
        run: |
          bash scripts/install-ci-tools.sh
      - name: Build exact dependency
        run: make deps
      - name: Validate chart, gateway, safety invariants, Turtle and Kubernetes schemas
        run: make validate PYTHON=.venv/bin/python
